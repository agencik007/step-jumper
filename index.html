<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Step Jumper</title>
<meta name="description" content="Zręcznościówka: wspinaczka po wieży, w której wysokość skoku zależy od rozpędu.">
<meta name="theme-color" content="#0a0d1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #1b2450 0%, #0a0d1f 70%);
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas {
    display: block; border-radius: 10px; background: #141a36;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 2px #2c3769;
  }
  svg.fx { position: absolute; width: 0; height: 0; }
  .pad { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); display: none; gap: 14px; }
  .pad button {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12);
    color: #fff; font: 700 30px/1 system-ui, sans-serif; touch-action: none;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .pad button.on { background: rgba(255,255,255,.32); }
  #padL { left: max(18px, env(safe-area-inset-left)); }
  #padR { right: max(18px, env(safe-area-inset-right)); }
  @media (pointer: coarse) { .pad { display: flex; } }
  body.tilt .pad { display: none; }   /* w trybie przechyłu przyciski znikają – cały ekran to „skok” */

  /* okienko nicku (zwykły formularz nad canvasem) */
  #nick[hidden] { display: none; }
  #nick {
    position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 10;
    width: min(360px, calc(100vw - 32px)); padding: 18px 18px 14px; border-radius: 14px;
    background: rgba(12,16,44,.96); border: 1.5px solid rgba(159,216,255,.45); color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); font: 600 14px/1.4 system-ui, sans-serif;
    -webkit-user-select: text; user-select: text; touch-action: auto;
  }
  #nick label { display: block; margin-bottom: 8px; color: #9fb4ee; font-size: 13px; }
  #nick input {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1.5px solid rgba(159,216,255,.45);
    background: #141a36; color: #fff; font: 700 18px/1.2 system-ui, sans-serif;
  }
  #nick input:focus { outline: 2px solid #ffe066; outline-offset: 1px; }
  #nick p { min-height: 1.4em; margin: 8px 0; color: #ff9a7f; font-size: 13px; }
  #nick small { display: block; margin-top: 10px; color: #9fb4ee; font-size: 12px; }
  #nick .row { display: flex; gap: 10px; justify-content: flex-end; }
  #nick button { padding: 9px 16px; border-radius: 9px; border: 1.5px solid rgba(159,216,255,.45); background: #1d2552; color: #fff; font: 700 14px system-ui, sans-serif; }
  #nick button[type=submit] { background: #ffd24a; color: #12173a; border-color: #12173a; }
  #nick button:disabled { opacity: .6; }
</style>
</head>
<body>
<!-- filtr mapy „Retro LCD”: jasność → 4 odcienie zieleni -->
<svg class="fx" aria-hidden="true">
  <filter id="fx-retro" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
    <feColorMatrix type="matrix" values=".299 .587 .114 0 0  .299 .587 .114 0 0  .299 .587 .114 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="gamma" exponent=".7" amplitude="1.1"/>
      <feFuncG type="gamma" exponent=".7" amplitude="1.1"/>
      <feFuncB type="gamma" exponent=".7" amplitude="1.1"/>
    </feComponentTransfer>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues=".06 .19 .52 .88"/>
      <feFuncG type="discrete" tableValues=".16 .42 .71 .94"/>
      <feFuncB type="discrete" tableValues=".10 .23 .28 .63"/>
    </feComponentTransfer>
  </filter>
</svg>

<div id="stage"><canvas id="game" aria-label="Step Jumper – gra zręcznościowa" data-i18n-aria="aria.game"></canvas></div>
<div class="pad" id="padL">
  <button data-act="left" aria-label="W lewo" data-i18n-aria="aria.left">◀</button>
  <button data-act="right" aria-label="W prawo" data-i18n-aria="aria.right">▶</button>
</div>
<div class="pad" id="padR">
  <button data-act="jump" aria-label="Skok" data-i18n-aria="aria.jump">▲</button>
</div>

<form id="nick" hidden autocomplete="off">
  <label for="nickInput" data-i18n="nick.label">Twój nick w rankingu</label>
  <input id="nickInput" maxlength="16" spellcheck="false" autocapitalize="off" enterkeyhint="done">
  <p id="nickErr" role="alert"></p>
  <div class="row"><button type="button" id="nickCancel" data-i18n="nick.cancel">Anuluj</button><button type="submit" id="nickSave" data-i18n="nick.save">Zapisz</button></div>
  <small data-i18n="nick.rules">3–16 znaków: litery, cyfry, _ - i pojedyncze spacje.</small>
</form>

<script type="module" src="/src/main.js"></script>
</body>
</html>
