<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Step Jumper</title>
<meta name="description" content="Zręcznościówka: wspinaczka po wieży, w której wysokość skoku zależy od rozpędu.">
<meta name="theme-color" content="#0a0d1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #1b2450 0%, #0a0d1f 70%);
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas {
    display: block; border-radius: 10px; background: #141a36;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 2px #2c3769;
  }
  svg.fx { position: absolute; width: 0; height: 0; }
  .pad { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); display: none; gap: 14px; }
  .pad button {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12);
    color: #fff; font: 700 30px/1 system-ui, sans-serif; touch-action: none;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .pad button.on { background: rgba(255,255,255,.32); }
  #padL { left: max(18px, env(safe-area-inset-left)); }
  #padR { right: max(18px, env(safe-area-inset-right)); }
  @media (pointer: coarse) { .pad { display: flex; } }
  body.tilt .pad { display: none; }   /* w trybie przechyłu przyciski znikają – cały ekran to „skok” */

  /* prawy górny róg okna: pauza (tylko w biegu) i pełny ekran – poza płótnem na większości ekranów */
  #corner {
    position: fixed; z-index: 6; display: flex; gap: 8px;
    top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
  }
  #corner button {
    width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
    border-radius: 10px; border: 1.5px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1);
    color: #fff; cursor: pointer; opacity: .75; touch-action: manipulation;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  #corner button[hidden] { display: none; }
  #corner button:hover, #corner button:focus-visible { opacity: 1; background: rgba(255,255,255,.2); }
  #corner button:focus-visible { outline: 2px solid #ffe066; outline-offset: 2px; }
  #corner svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #fs .ico-exit, #fs.on .ico-enter { display: none; }
  #fs.on .ico-exit { display: block; }
  :fullscreen #fs { opacity: .45; }
  /* pauza: na telefonie większa, bo to jedyny sposób, żeby zatrzymać bieg */
  #pause { display: none !important; }
  body[data-state=play] #pause, body[data-state=pause] #pause { display: grid !important; }
  @media (pointer: coarse) { #corner #pause { width: 52px; height: 52px; opacity: .85; } #corner #pause svg { width: 26px; height: 26px; } }
  #pause svg { fill: currentColor; stroke: none; }
  #pause .ico-play, body[data-state=pause] #pause .ico-pause { display: none; }
  body[data-state=pause] #pause .ico-play { display: block; }

  /* okienka instalacji: iOS „Do ekranu początkowego”, Android „Zainstaluj grę” */
  .sheet[hidden] { display: none; }
  .sheet {
    position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; padding: 16px;
    background: rgba(5,7,20,.6); touch-action: auto;
  }
  .sheet .card {
    width: min(440px, 100%); max-height: calc(100dvh - 32px); overflow: auto; padding: 18px 18px 14px; border-radius: 14px;
    background: rgba(12,16,44,.97); border: 1.5px solid rgba(159,216,255,.45); color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); font: 600 14px/1.45 system-ui, sans-serif;
  }
  .sheet h2 { margin: 0 0 6px; color: #ffd24a; font: 800 20px/1.2 system-ui, sans-serif; }
  .sheet .lead { margin: 0 0 10px; color: #9fb4ee; font-size: 13px; }
  .sheet ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 9px; }
  .sheet li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
  .sheet li::before {
    content: counter(s); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: #ffd24a; color: #12173a; font: 800 14px system-ui, sans-serif;
  }
  .sheet li svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 4px; fill: none; stroke: #7ec8ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sheet small { display: block; margin-top: 12px; color: #9fb4ee; font-size: 12px; }
  .sheet .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
  .sheet button.alt { background: #1d2552; color: #fff; border-color: rgba(159,216,255,.45); }
  /* Android bez beforeinstallprompt: instrukcja z menu zamiast przycisku ZAINSTALUJ */
  #android .only-manual, #android.manual .only-auto { display: none; }
  #android.manual .only-manual { display: block; }
  #android.manual button.only-manual { display: inline-block; }
  .sheet button { padding: 9px 18px; border-radius: 9px; border: 1.5px solid #12173a; background: #ffd24a; color: #12173a; font: 700 14px system-ui, sans-serif; }
  .sheet button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  /* telefon w poziomie: niski ekran – ciaśniej, żeby całość weszła bez przewijania */
  @media (max-height: 520px) {
    .sheet .card { width: min(620px, 100%); padding: 12px 16px 10px; font-size: 12.5px; line-height: 1.35; }
    .sheet h2 { font-size: 17px; margin-bottom: 3px; }
    .sheet .lead { margin-bottom: 7px; font-size: 12px; }
    .sheet ol { gap: 5px; }
    .sheet li { grid-template-columns: 22px 1fr; gap: 8px; }
    .sheet li::before { width: 20px; height: 20px; font-size: 12px; }
    .sheet small { margin-top: 7px; font-size: 11px; }
    .sheet .row { margin-top: 6px; }
    .sheet button { padding: 6px 16px; }
  }

  /* okienko nicku (zwykły formularz nad canvasem) */
  #nick[hidden] { display: none; }
  #nick {
    position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 10;
    width: min(360px, calc(100vw - 32px)); padding: 18px 18px 14px; border-radius: 14px;
    background: rgba(12,16,44,.96); border: 1.5px solid rgba(159,216,255,.45); color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); font: 600 14px/1.4 system-ui, sans-serif;
    -webkit-user-select: text; user-select: text; touch-action: auto;
  }
  #nick label { display: block; margin-bottom: 8px; color: #9fb4ee; font-size: 13px; }
  #nick input {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1.5px solid rgba(159,216,255,.45);
    background: #141a36; color: #fff; font: 700 18px/1.2 system-ui, sans-serif;
  }
  #nick input:focus { outline: 2px solid #ffe066; outline-offset: 1px; }
  #nick p { min-height: 1.4em; margin: 8px 0; color: #ff9a7f; font-size: 13px; }
  #nick small { display: block; margin-top: 10px; color: #9fb4ee; font-size: 12px; }
  #nick .row { display: flex; gap: 10px; justify-content: flex-end; }
  #nick button { padding: 9px 16px; border-radius: 9px; border: 1.5px solid rgba(159,216,255,.45); background: #1d2552; color: #fff; font: 700 14px system-ui, sans-serif; }
  #nick button[type=submit] { background: #ffd24a; color: #12173a; border-color: #12173a; }
  #nick button:disabled { opacity: .6; }
</style>
</head>
<body>
<!-- filtr mapy „Retro LCD”: jasność → 4 odcienie zieleni -->
<svg class="fx" aria-hidden="true">
  <filter id="fx-retro" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
    <feColorMatrix type="matrix" values=".299 .587 .114 0 0  .299 .587 .114 0 0  .299 .587 .114 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="gamma" exponent=".7" amplitude="1.1"/>
      <feFuncG type="gamma" exponent=".7" amplitude="1.1"/>
      <feFuncB type="gamma" exponent=".7" amplitude="1.1"/>
    </feComponentTransfer>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues=".06 .19 .52 .88"/>
      <feFuncG type="discrete" tableValues=".16 .42 .71 .94"/>
      <feFuncB type="discrete" tableValues=".10 .23 .28 .63"/>
    </feComponentTransfer>
  </filter>
</svg>

<div id="stage"><canvas id="game" aria-label="Step Jumper – gra zręcznościowa" data-i18n-aria="aria.game"></canvas></div>
<div class="pad" id="padL">
  <button data-act="left" aria-label="W lewo" data-i18n-aria="aria.left">◀</button>
  <button data-act="right" aria-label="W prawo" data-i18n-aria="aria.right">▶</button>
</div>
<div class="pad" id="padR">
  <button data-act="jump" aria-label="Skok" data-i18n-aria="aria.jump">▲</button>
</div>

<div id="corner">
<button id="pause" type="button" aria-label="Pauza (P)" title="Pauza (P)" data-i18n-aria="aria.pause">
  <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
</button>
<button id="fs" type="button" aria-label="Pełny ekran (F)" title="Pełny ekran (F)" data-i18n-aria="aria.fs">
  <svg class="ico-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
  <svg class="ico-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
</button>
</div>

<div id="ios" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="iosTitle">
  <div class="card">
    <h2 id="iosTitle" data-i18n="ios.title">Graj na pełnym ekranie</h2>
    <p class="lead" data-i18n="ios.lead"></p>
    <ol>
      <li><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg><span data-i18n="ios.step1"></span></span></li>
      <li><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg><span data-i18n="ios.step2"></span></span></li>
      <li><span data-i18n="ios.step3"></span></li>
      <li><span data-i18n="ios.step4"></span></li>
    </ol>
    <small data-i18n="ios.chrome"></small>
    <div class="row"><button type="button" id="iosOk" data-i18n="ios.ok">Rozumiem</button></div>
  </div>
</div>

<div id="android" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="andTitle">
  <div class="card">
    <h2 id="andTitle" data-i18n="and.title">Zainstaluj Step Jumpera</h2>
    <p class="lead" data-i18n="and.lead"></p>
    <ol class="only-manual">
      <li><span data-i18n="and.step1"></span></li>
      <li><span data-i18n="and.step2"></span></li>
    </ol>
    <div class="row">
      <button type="button" id="andLater" class="alt only-auto" data-i18n="and.later">Nie teraz</button>
      <button type="button" id="andInstall" class="only-auto" data-i18n="and.install">Zainstaluj</button>
      <button type="button" id="andOk" class="only-manual" data-i18n="ios.ok">Rozumiem</button>
    </div>
  </div>
</div>

<form id="nick" hidden autocomplete="off">
  <label for="nickInput" id="nickLabel" data-i18n="nick.label">Twój nick w rankingu</label>
  <input id="nickInput" maxlength="16" spellcheck="false" autocapitalize="off" enterkeyhint="done">
  <p id="nickErr" role="alert"></p>
  <div class="row"><button type="button" id="nickCancel" data-i18n="nick.cancel">Anuluj</button><button type="submit" id="nickSave" data-i18n="nick.save">Zapisz</button></div>
  <small data-i18n="nick.rules">3–16 znaków: litery, cyfry, _ - i pojedyncze spacje.</small>
</form>

<script type="module" src="/src/main.js"></script>
</body>
</html>
