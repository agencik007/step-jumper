<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Step Jumper</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #1b2450 0%, #0a0d1f 70%);
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas {
    display: block; border-radius: 10px; background: #141a36;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 2px #2c3769;
  }
  svg.fx { position: absolute; width: 0; height: 0; }
  .pad { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); display: none; gap: 14px; }
  .pad button {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12);
    color: #fff; font: 700 30px/1 system-ui, sans-serif; touch-action: none;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .pad button.on { background: rgba(255,255,255,.32); }
  #padL { left: max(18px, env(safe-area-inset-left)); }
  #padR { right: max(18px, env(safe-area-inset-right)); }
  @media (pointer: coarse) { .pad { display: flex; } }
  body.tilt .pad { display: none; }   /* w trybie przechyłu przyciski znikają – cały ekran to „skok” */
</style>
</head>
<body>
<!-- filtr mapy „Retro LCD”: jasność → 4 odcienie zieleni -->
<svg class="fx" aria-hidden="true">
  <filter id="fx-retro" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
    <feColorMatrix type="matrix" values=".299 .587 .114 0 0  .299 .587 .114 0 0  .299 .587 .114 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="gamma" exponent=".7" amplitude="1.1"/>
      <feFuncG type="gamma" exponent=".7" amplitude="1.1"/>
      <feFuncB type="gamma" exponent=".7" amplitude="1.1"/>
    </feComponentTransfer>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues=".06 .19 .52 .88"/>
      <feFuncG type="discrete" tableValues=".16 .42 .71 .94"/>
      <feFuncB type="discrete" tableValues=".10 .23 .28 .63"/>
    </feComponentTransfer>
  </filter>
</svg>

<div id="stage"><canvas id="game" aria-label="Step Jumper – gra zręcznościowa"></canvas></div>
<div class="pad" id="padL">
  <button data-act="left" aria-label="W lewo">◀</button>
  <button data-act="right" aria-label="W prawo">▶</button>
</div>
<div class="pad" id="padR">
  <button data-act="jump" aria-label="Skok">▲</button>
</div>

<script type="module">
// ───────────────────────── stałe ─────────────────────────
const W = 640, H = 480;
const WALL = 96, LEFT = WALL, RIGHT = W - WALL, FIELD = RIGHT - LEFT;
const GAP = 80;            // odstęp pięter
const PLAT_H = 18;
const STEP = 1 / 120;      // stały krok fizyki
const HW = 13;             // połowa szerokości bohatera (ściany)
const FOOT = 9;            // połowa szerokości stóp (krawędzie platform)
const HERO_H = 58;
const FOLLOW = 170;        // kamera goni bohatera powyżej tej linii ekranu
const START_FLOOR = 5;     // od tego piętra wieża zaczyna się przesuwać
const HURRY_EVERY = 30;    // sekundy – pełny obrót zegara
const MAX_HURRIES = 5;     // po piątym obrocie zegar staje, tempo już nie rośnie
const COMBO_TIME = 3;      // sekundy na kolejny skok w combo

const P = {
  accel: 760, turn: 1.8, maxVx: 580,
  fricGround: 900, fricAir: 200,
  gravity: 1900, maxFall: 1150,
  jumpBase: 620, jumpBoost: 700, jumpPow: 1.4,   // skok tym wyższy, im szybszy bieg
  spinAt: 0.42,
};

const TIERS = [
  [200, 'NIEMOŻLIWE!'], [140, 'KOSMOS!'], [100, 'FANTASTYCZNIE!'], [70, 'EKSTREMALNIE!'],
  [50, 'NIESAMOWICIE!'], [35, 'WOW!'], [25, 'SUPER!'], [15, 'ŚWIETNIE!'], [7, 'ŁADNIE!'], [4, 'NIEŹLE!'],
];

// wygląd platform zmienia się co 100 pięter
const THEMES = [
  { top: '#f4fbff', body: '#7cc7f2', dark: '#3f8fd0', decor: 'drips',  drip: '#c9ecff' }, // lód
  { top: '#c9ced6', body: '#8b93a1', dark: '#5b6270', decor: 'seams' },                    // kamień
  { top: '#e2b071', body: '#a8713a', dark: '#6e4520', decor: 'seams' },                    // drewno
  { top: '#ffc59a', body: '#c8693a', dark: '#8a3f1e', decor: 'rivets' },                   // miedź
  { top: '#b8ec7a', body: '#5aa043', dark: '#356b2a', decor: 'drips',  drip: '#4c8f3a' }, // mech
  { top: '#ffe27a', body: '#f0642d', dark: '#9c2a14', decor: 'drips',  drip: '#ffb347' }, // lawa
  { top: '#f3d9ff', body: '#b06cf0', dark: '#6d35b0', decor: 'rivets' },                   // kryształ
  { top: '#ffffff', body: '#dfe9f7', dark: '#a9bbd6', decor: 'none' },                     // chmura
  { top: '#fff3a8', body: '#f2c230', dark: '#a87a10', decor: 'rivets' },                   // złoto
  { top: '#aaffee', body: '#16c7c0', dark: '#0b6f8a', decor: 'seams' },                    // neon
];
const themeOf = (n) => THEMES[Math.floor(n / 100) % THEMES.length];
const NEON = ['#5ef5ff', '#ff5ee0', '#fff36b', '#7dff8a', '#ff9a4a', '#b98cff'];
const PENCILS = ['#3b6fd4', '#d4483b', '#2f9e5b', '#8a4fd0', '#e08a1e', '#1f9aa8'];
const cycle = (arr, n) => arr[Math.floor(n / 100) % arr.length];
const PEN = '#1f2a44';

// ───────────────────────── narzędzia ─────────────────────────
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (v, m) => ((v % m) + m) % m;
const rand = (a, b) => a + Math.random() * (b - a);
const hash = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const mainCtx = canvas.getContext('2d');
let ctx = mainCtx;                                   // bieżący cel rysowania (ekran albo bufor niskiej rozdzielczości)

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const s = Math.min(stage.clientWidth / W, stage.clientHeight / H);
  const cw = Math.max(64, Math.floor(W * s)), ch = Math.max(48, Math.floor(H * s));
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
}
new ResizeObserver(resize).observe(stage);
resize();

// ───────────────────────── dźwięk (Web Audio, syntezowany) ─────────────────────────
class Sfx {
  ctx = null; out = null; muted = false;
  unlock() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.out = this.ctx.createGain();
        this.out.gain.value = 0.2;
        this.out.connect(this.ctx.destination);
      } catch { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  }
  tone(f0, f1, dur, { type = 'square', vol = 0.5, at = 0 } = {}) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + at;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.out);
    o.start(t); o.stop(t + dur + 0.02);
  }
  noise(dur, { vol = 0.4, freq = 900 } = {}) {
    if (!this.ctx || this.muted) return;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(this.out);
    src.start();
  }
  jump(p)  { this.tone(240 + p * 240, 500 + p * 800, 0.14 + p * 0.12, { vol: 0.3 }); }
  land()   { this.noise(0.07, { vol: 0.4, freq: 700 }); }
  bounce() { this.tone(190, 85, 0.1, { type: 'triangle', vol: 0.7 }); }
  pick()   { this.tone(660, 880, 0.07, { type: 'triangle', vol: 0.5 }); }
  combo(tier) {
    const scale = [523, 659, 784, 1047, 1319, 1568, 2093];
    const n = clamp(3 + tier, 3, 7);
    for (let i = 0; i < n; i++) this.tone(scale[i], scale[i], 0.13, { type: 'triangle', vol: 0.55, at: i * 0.07 });
  }
  hurry()  { for (let i = 0; i < 4; i++) this.tone(1320, 1320, 0.1, { type: 'sine', vol: 0.7, at: i * 0.15 }); }
  over()   { this.tone(420, 70, 0.7, { type: 'sawtooth', vol: 0.35 }); }
}
const sfx = new Sfx();

// ───────────────────────── tekstury ─────────────────────────
function makePattern(w, h, draw, R = 3) {
  const c = document.createElement('canvas');
  c.width = w * R; c.height = h * R;
  const g = c.getContext('2d'); g.scale(R, R); draw(g);
  const p = mainCtx.createPattern(c, 'repeat');
  p.setTransform(new DOMMatrix().scaleSelf(1 / R));
  return p;
}
const brickPattern = makePattern(64, 32, (g) => {
  const cols = ['#252e5a', '#222a52', '#283263', '#20274d', '#242c57'];
  g.fillStyle = '#151a38'; g.fillRect(0, 0, 64, 32);
  [[0, 0], [32, 0], [-16, 16], [16, 16], [48, 16]].forEach(([x, y], i) => {
    g.fillStyle = cols[i]; g.fillRect(x + 1, y + 1, 30, 14);
    g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(x + 1, y + 1, 30, 2);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x + 1, y + 13, 30, 2);
  });
});
const stonePattern = makePattern(48, 48, (g) => {
  g.fillStyle = '#262d57'; g.fillRect(0, 0, 48, 48);
  [[0, 0], [-24, 24], [24, 24]].forEach(([x, y], i) => {
    g.fillStyle = i ? '#444e88' : '#4a5592'; g.fillRect(x + 1.5, y + 1.5, 45, 21);
    g.fillStyle = '#5d69aa'; g.fillRect(x + 1.5, y + 1.5, 45, 3);
    g.fillStyle = '#363f73'; g.fillRect(x + 1.5, y + 19.5, 45, 3);
  });
});
const hatchPattern = makePattern(12, 12, (g) => {
  g.strokeStyle = 'rgba(31,42,68,.2)'; g.lineWidth = 1; g.lineCap = 'square';
  for (const o of [-12, 0, 12]) { g.beginPath(); g.moveTo(-2 + o, 14); g.lineTo(14 + o, -2); g.stroke(); }
});
const scanPattern = makePattern(4, 3, (g) => { g.fillStyle = 'rgba(0,0,0,.26)'; g.fillRect(0, 0, 4, 1); }, 1);
const grainPattern = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'), id = g.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) {
    id.data[i] = id.data[i + 1] = id.data[i + 2] = Math.random() * 255 | 0;
    id.data[i + 3] = 30 + Math.random() * 60;
  }
  g.putImageData(id, 0, 0);
  return mainCtx.createPattern(cv, 'repeat');
})();

// bufor niskiej rozdzielczości + raster Bayera dla mapy retro
const lowCanvas = document.createElement('canvas');
const lowCtx = lowCanvas.getContext('2d');
const ditherPattern = (() => {
  const B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const cv = document.createElement('canvas'); cv.width = cv.height = 4;
  const g = cv.getContext('2d');
  B.forEach((b, i) => {
    const v = (b + 0.5) / 16 - 0.5;
    g.fillStyle = v > 0 ? `rgba(255,255,255,${v * 0.36})` : `rgba(0,0,0,${-v * 0.5})`;
    g.fillRect(i % 4, i >> 2, 1, 1);
  });
  return lowCtx.createPattern(cv, 'repeat');
})();

// ───────────────────────── mapy (style graficzne) ─────────────────────────
const UI_ICE = {
  text: '#ffffff', stroke: '#0b1030', label: '#9fb4ee', hint: '#cfe3ff', gold: '#ffe066', mint: '#7ef0e0', warn: '#ff7a59', note: '#ffe680',
  panel: 'rgba(12,16,44,.84)', line: 'rgba(159,216,255,.35)', frame: '#12173a', dim: '6,9,28',
  meterBg: '#262d57', off: '#3a4478', offText: '#8f9bd0', sel: 'rgba(255,224,102,.16)',
  btn: '#ffd24a', btnText: '#12173a', title: ['#ffffff', '#a9e4ff', '#4aa8f0'], titleStroke: '#12327a',
};
const UI_NEON = {
  text: '#ffffff', stroke: '#12002b', label: '#ff8bec', hint: '#9ef7ff', gold: '#fff36b', mint: '#5ef5ff', warn: '#ff4f8b', note: '#fff36b',
  panel: 'rgba(16,2,40,.86)', line: 'rgba(94,245,255,.6)', frame: '#12002b', dim: '8,0,24',
  meterBg: '#2a0a4a', off: '#3b1a66', offText: '#9a7ad0', sel: 'rgba(94,245,255,.16)',
  btn: '#ff5ee0', btnText: '#12002b', title: ['#ffffff', '#ffb3f3', '#ff3fd0'], titleStroke: '#5a0a8a',
};
const UI_SKETCH = {
  text: PEN, stroke: '#f7f2e4', label: '#5a6a8c', hint: '#3b4a6b', gold: '#c2410c', mint: '#0f766e', warn: '#c81e1e', note: '#7a4f00',
  panel: 'rgba(255,253,244,.93)', line: 'rgba(31,42,68,.6)', frame: PEN, dim: '247,242,228',
  meterBg: '#e4dcc6', off: '#d9d0b8', offText: '#8a8468', sel: 'rgba(194,65,12,.13)',
  btn: PEN, btnText: '#fffdf4', title: ['#3b6fd4', '#2d55b0', '#1f3a7a'], titleStroke: '#f7f2e4',
};
const BASE_FONT = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';

const STYLES = [
  { id: 'ice', name: 'Zamieć', desc: 'mroźna klasyka', world: 'ice', ui: UI_ICE },
  { id: 'film', name: 'Stare kino', desc: 'czarno-biała taśma z rysami i ziarnem', world: 'ice', ui: UI_ICE,
    filter: 'grayscale(1) sepia(.3) contrast(1.15) brightness(1.3)', font: 'Georgia, "Times New Roman", serif', post: filmPost },
  { id: 'retro', name: 'Retro LCD', desc: 'cztery odcienie zieleni i grube piksele', world: 'ice', ui: UI_ICE,
    filter: 'url(#fx-retro)', pixel: 2, font: '"Courier New", ui-monospace, monospace' },
  { id: 'neon', name: 'Neon', desc: 'świecące kontury na siatce', world: 'neon', ui: UI_NEON, post: neonPost },
  { id: 'sketch', name: 'Zeszyt', desc: 'ołówek na papierze w kratkę', world: 'sketch', ui: UI_SKETCH,
    font: '"Comic Sans MS", "Segoe Print", "Bradley Hand", cursive', post: sketchPost },
];
let style = STYLES[0], ui = style.ui, FONT = BASE_FONT;

function filmPost(g) {
  const c = ctx, f = Math.floor(g.t * 16);            // efekty „skaczą” jak klatki taśmy
  c.save();
  c.globalAlpha = 0.55; c.translate(-hash(f, 1) * 128, -hash(f, 2) * 128);
  c.fillStyle = grainPattern; c.fillRect(0, 0, W + 128, H + 128);
  c.restore();
  if (!reduceMotion) {
    c.fillStyle = `rgba(255,255,255,${0.015 + hash(f, 3) * 0.05})`; c.fillRect(0, 0, W, H);
    if (hash(f, 4) > 0.95) { c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(0, 0, W, H); }
  }
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1;
  for (let i = 0; i < 2; i++) {                        // pionowe rysy
    const life = Math.floor(g.t * 1.3 + i * 0.5);
    if (hash(life, 10 + i) > 0.4) {
      const x = hash(life, 20 + i) * W + (hash(f, 30 + i) - 0.5) * 3;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x + (hash(life, 40 + i) - 0.5) * 6, H); c.stroke();
    }
  }
  c.fillStyle = 'rgba(15,15,15,.75)';
  for (let i = 0; i < 3; i++) {                        // paprochy
    if (hash(f, 50 + i) > 0.6) {
      c.beginPath();
      c.ellipse(hash(f, 60 + i) * W, hash(f, 70 + i) * H, 1 + hash(f, 80 + i) * 2.5, 1 + hash(f, 90 + i) * 1.5, hash(f, 95 + i) * 3, 0, 7);
      c.fill();
    }
  }
  const v = c.createRadialGradient(W / 2, H / 2, H * 0.38, W / 2, H / 2, H * 0.9);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.8)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
}
function neonPost() {
  const c = ctx;
  c.fillStyle = scanPattern; c.fillRect(0, 0, W, H);
  const v = c.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,0,30,.6)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
}
function sketchPost() {
  const c = ctx;
  c.save(); c.globalAlpha = 0.18; c.fillStyle = grainPattern; c.fillRect(0, 0, W, H); c.restore();
}

// ───────────────────────── rysowanie – pomocnicze ─────────────────────────
function text(str, x, y, { size = 16, color = ui.text, align = 'center', stroke = ui.stroke, sw = 4, weight = 800, maxW } = {}) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (sw > 0) { ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.strokeText(str, x, y, maxW); }
  ctx.fillStyle = color; ctx.fillText(str, x, y, maxW);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function burst(x, y, r1, r2, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r1 : r2, a = rot + i * Math.PI / n;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function wobblyRect(x, y, w, h, seed, amp = 1.2) {     // „odręczny” prostokąt
  const n = Math.max(2, Math.round(w / 36));
  let k = 0;
  const j = () => (hash(seed, k++) - 0.5) * 2 * amp;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) ctx.lineTo(x + (w * i) / n + j(), y + j());
  ctx.lineTo(x + w + j(), y + h / 2 + j());
  for (let i = n; i >= 0; i--) ctx.lineTo(x + (w * i) / n + j(), y + h + j());
  ctx.lineTo(x + j(), y + h / 2 + j());
  ctx.closePath();
}

// ───────────────────────── postacie ─────────────────────────
const INK = '#3a1c10';

function legs(c, p, { color, w = 8.5, len = 9, gap = 4, r = 3, foot = null }) {
  const swing = Math.sin(p.ph) * 7 * p.run;
  const L = p.air
    ? (p.rise > 0 ? [[-gap - 1, len * 0.66, -0.5], [gap, len * 0.66, 0.5]] : [[-gap - 1, len * 1.1, 0.2], [gap + 1, len * 1.1, -0.2]])
    : [[-gap - swing, len - Math.max(0, Math.cos(p.ph)) * 3 * p.run, 0], [gap + swing, len - Math.max(0, -Math.cos(p.ph)) * 3 * p.run, 0]];
  for (const [lx, ll, rot] of L) {
    c.save(); c.translate(lx, -ll); c.rotate(rot);
    c.fillStyle = color; rr(-w / 2 + 0.75, 0, w, ll, r); c.fill(); c.stroke();
    if (foot) { c.fillStyle = foot.color; rr(-w / 2 + 0.75, ll - foot.h, w + foot.ext, foot.h, foot.h / 2); c.fill(); c.stroke(); }
    c.restore();
  }
}
function arm(c, p, { x = 1, y = -24, len = 8, color, w = 4 }) {
  const a = p.air ? (p.rise > 0 ? -1.3 : 0.5) : 1.1 + Math.sin(p.ph) * 0.9 * p.run;
  const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len;
  c.save();
  c.strokeStyle = INK; c.lineWidth = w + 2.6; c.beginPath(); c.moveTo(x, y); c.lineTo(ex, ey); c.stroke();
  c.strokeStyle = color; c.lineWidth = w; c.beginPath(); c.moveTo(x, y); c.lineTo(ex, ey); c.stroke();
  c.restore();
}
function eye(c, p, x, y, { rx = 3.3, ry = 4.2, white = '#fff', slit = false } = {}) {
  if (!p.air && (p.t % 3.4) < 0.11) { c.beginPath(); c.moveTo(x - rx, y); c.lineTo(x + rx, y); c.stroke(); return; }
  const big = p.air ? 1.15 : 1;
  c.fillStyle = white; c.beginPath(); c.ellipse(x, y, rx * big, ry * big, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = INK; c.beginPath();
  if (slit) c.ellipse(x + 0.8, y - p.rise, 1.1, ry * 0.75, 0, 0, 7); else c.arc(x + 1.2, y - p.rise * 1.2, 1.9, 0, 7);
  c.fill();
}
function ears(c, list, fill, inner) {
  for (const [ax, ay, bx, by, cx, cy] of list) {
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.lineTo(cx, cy); c.closePath();
    c.fillStyle = fill; c.fill(); c.stroke();
    c.fillStyle = inner; c.beginPath();
    c.moveTo(bx, by); c.lineTo(bx + (ax - bx) * 0.45, by + (ay - by) * 0.45); c.lineTo(bx + (cx - bx) * 0.45, by + (cy - by) * 0.45);
    c.closePath(); c.fill();
  }
}

// 1. Rudy – lis w szaliku
const FOX_TAIL = new Path2D('M0 -5 C-10 -20 -33 -15 -33 0 C-31 11 -10 10 0 4 Z');
function drawFox(c, p) {
  const FUR = '#f08a2e', FUR_D = '#d46f1c', CREAM = '#fff1dc', PAW = '#5a2d1a', SCARF = '#19b5a5', SCARF_D = '#0f8f83';
  c.save();
  c.translate(-7, -13);
  c.rotate(-0.55 + Math.sin(p.t * 6) * 0.12 + (p.air ? 0.7 * p.rise : Math.sin(p.ph) * 0.15 * p.run));
  c.fillStyle = FUR; c.fill(FOX_TAIL);
  c.save(); c.clip(FOX_TAIL); c.fillStyle = CREAM; c.beginPath(); c.arc(-31, 0, 12, 0, 7); c.fill(); c.restore();
  c.stroke(FOX_TAIL);
  c.restore();
  legs(c, p, { color: PAW });
  c.fillStyle = FUR; c.beginPath(); c.ellipse(0, -19, 10.5, 12.5, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = CREAM; c.beginPath(); c.ellipse(3.5, -16, 5.5, 8, 0, 0, 7); c.fill();
  // ogon szalika zdradza prędkość
  const fx = -8 - clamp(p.vxl / P.maxVx, -1, 1) * 22, fy = p.rise * 16 + 5;
  const wave = Math.sin(p.t * 15) * 3 * (0.4 + Math.min(1, p.speed / 300 + Math.abs(p.vy) / 600));
  c.save(); c.strokeStyle = SCARF_D; c.lineWidth = 5.5;
  c.beginPath(); c.moveTo(-6, -28); c.quadraticCurveTo(-6 + fx * 0.5, -28 + fy * 0.5 + wave, -6 + fx, -28 + fy - wave); c.stroke();
  c.restore();
  ears(c, [[-8, -44, -7, -59, 1, -49], [3, -49, 10, -60, 13, -45]], FUR, PAW);
  c.fillStyle = FUR; c.beginPath(); c.arc(2, -39, 11.5, 0, 7); c.fill(); c.stroke();
  c.fillStyle = CREAM;
  c.beginPath(); c.ellipse(9.5, -35, 7.5, 5.5, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(-3, -33, 5, 4, 0.5, 0, 7); c.fill();
  c.fillStyle = INK; c.beginPath(); c.arc(16, -37, 2.3, 0, 7); c.fill();
  eye(c, p, 6, -42.5);
  c.beginPath(); c.arc(9.5, -34, 4, 0.5, 1.9); c.stroke();
  c.fillStyle = SCARF; rr(-9.5, -31.5, 20, 6.5, 3); c.fill(); c.stroke();
  arm(c, p, { color: FUR_D });
}

// 2. Kra – pingwin w nausznikach
function drawPenguin(c, p) {
  const BLUE = '#4468b8', BLUE_L = '#5d82d6', ORANGE = '#ff9d2e', RED = '#e5482f';
  c.fillStyle = BLUE; c.beginPath(); c.moveTo(-9, -9); c.lineTo(-18, -3); c.lineTo(-7, -2); c.closePath(); c.fill(); c.stroke();
  legs(c, p, { color: ORANGE, w: 8, len: 5, gap: 4.5, r: 2.5, foot: { color: ORANGE, h: 4, ext: 4.5 } });
  c.fillStyle = BLUE; c.beginPath(); c.ellipse(0, -23, 13, 20, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(3.5, -18, 8.5, 14, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(6, -34, 6.5, 6, 0, 0, 7); c.fill();
  eye(c, p, 6, -35.5, { rx: 2.8, ry: 3.6 });
  c.fillStyle = ORANGE; c.beginPath(); c.moveTo(10, -32.5); c.lineTo(20.5, -29.5); c.lineTo(10, -27); c.closePath(); c.fill(); c.stroke();
  c.save();                                           // pałąk nauszników
  c.strokeStyle = INK; c.lineWidth = 5.2; c.beginPath(); c.moveTo(-4, -35); c.quadraticCurveTo(-4, -42, 0, -44); c.stroke();
  c.strokeStyle = RED; c.lineWidth = 2.8; c.stroke();
  c.restore();
  c.fillStyle = RED; c.beginPath(); c.arc(-4, -33.5, 5.2, 0, 7); c.fill(); c.stroke();
  arm(c, p, { x: -1, y: -25, len: 12, color: BLUE_L, w: 6 });
}

// 3. Kumka – żaba w koronie
function drawFrog(c, p) {
  const G = '#5cbf4a', GD = '#3d8f33', GL = '#d2f5a8';
  legs(c, p, { color: GD, w: 9, len: p.air ? 13 : 8, gap: 6.5, r: 3.5, foot: { color: GD, h: 4, ext: 5 } });
  c.fillStyle = '#ffd24a';                             // korona
  c.beginPath(); c.moveTo(-3, -35); c.lineTo(-4.5, -45); c.lineTo(-0.5, -40.5); c.lineTo(2.5, -47); c.lineTo(5.5, -40.5); c.lineTo(9.5, -45); c.lineTo(8, -35);
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle = G; c.beginPath(); c.ellipse(0, -17, 14, 13, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = GL; c.beginPath(); c.ellipse(3, -12.5, 9, 7.5, 0, 0, 7); c.fill();
  for (const [ex, ey] of [[-5, -29.5], [8, -30.5]]) { c.fillStyle = G; c.beginPath(); c.arc(ex, ey, 6.8, 0, 7); c.fill(); c.stroke(); }
  c.fillStyle = G; c.beginPath(); c.ellipse(1.5, -24, 11.5, 5.5, 0, 0, 7); c.fill();
  eye(c, p, -4, -30, { rx: 3.7, ry: 4.1 });
  eye(c, p, 9, -31, { rx: 3.9, ry: 4.3 });
  c.beginPath(); c.moveTo(1, -19.5); c.quadraticCurveTo(8.5, -15, 14, -20.5); c.stroke();
  c.fillStyle = 'rgba(255,110,110,.55)'; c.beginPath(); c.arc(11, -23.5, 2.2, 0, 7); c.fill();
  arm(c, p, { x: 2, y: -16, len: 8, color: GD, w: 4 });
}

// 4. Zgrzyt – robot z odrzutem
function drawRobot(c, p) {
  const M = '#cdd6e6', MD = '#8090ab', DK = '#343d57', RED = '#ff5a4d', CY = '#7ef0e0';
  if (p.air && p.rise > 0.12) {                        // płomień dyszy
    const fl = 5 + p.rise * 9 + Math.sin(p.t * 50) * 2.5;
    c.fillStyle = '#ffb347'; c.beginPath(); c.moveTo(-5, -4); c.lineTo(0, fl); c.lineTo(5, -4); c.closePath(); c.fill();
    c.fillStyle = '#fff3a8'; c.beginPath(); c.moveTo(-2.5, -4); c.lineTo(0, fl * 0.5); c.lineTo(2.5, -4); c.closePath(); c.fill();
  }
  legs(c, p, { color: MD, w: 6, len: 9, gap: 4.5, r: 1.5, foot: { color: DK, h: 4, ext: 3 } });
  c.fillStyle = MD; rr(-14, -29, 7, 15, 2.5); c.fill(); c.stroke();
  c.fillStyle = M; rr(-10, -31, 20, 23, 5); c.fill(); c.stroke();
  c.fillStyle = DK; rr(0, -27, 8, 9, 2); c.fill();
  c.fillStyle = (p.t * 2) % 1 < 0.5 ? CY : RED; c.beginPath(); c.arc(4, -22.5, 2.1, 0, 7); c.fill();
  c.fillStyle = MD; c.fillRect(-3, -34.5, 7, 4.5); c.strokeRect(-3, -34.5, 7, 4.5);
  const tip = -3 - clamp(p.vxl / P.maxVx, -1, 1) * 4;   // antena ugina się od pędu
  c.beginPath(); c.moveTo(-1, -50); c.quadraticCurveTo(-1, -55, tip, -58); c.stroke();
  c.fillStyle = RED; c.beginPath(); c.arc(tip, -59, 2.9, 0, 7); c.fill(); c.stroke();
  c.fillStyle = M; rr(-10, -51, 23, 17.5, 5.5); c.fill(); c.stroke();
  c.fillStyle = DK; rr(0.5, -47, 12, 9, 3.5); c.fill();
  const blink = !p.air && (p.t % 3.4) < 0.11;
  c.fillStyle = CY; rr(5.5, -45 - p.rise + (blink ? 1.8 : 0), 5, blink ? 1.4 : 5, 1.4); c.fill();
  c.fillStyle = MD; c.beginPath(); c.arc(-5, -42, 3.1, 0, 7); c.fill(); c.stroke();
  arm(c, p, { x: 0, y: -25, len: 9, color: MD, w: 4.5 });
}

// 5. Figa – kotka z dzwoneczkiem
function drawCat(c, p) {
  const B = '#b79cf0', BD = '#8f6fe0', BL = '#ece3ff', PINK = '#ff8fb0', RED = '#e5482f';
  const sway = Math.sin(p.t * 5) * 4 + (p.air ? -p.rise * 9 : 0) - clamp(p.vxl / P.maxVx, -1, 1) * 6;
  const tail = () => { c.beginPath(); c.moveTo(-7, -10); c.bezierCurveTo(-23, -7, -25, -22, -19 + sway * 0.5, -31); c.quadraticCurveTo(-16 + sway, -38, -22 + sway, -41); };
  c.save();
  c.lineWidth = 8; c.strokeStyle = INK; tail(); c.stroke();
  c.lineWidth = 5.2; c.strokeStyle = B; tail(); c.stroke();
  c.restore();
  legs(c, p, { color: B, w: 8, len: 9, gap: 4, r: 3, foot: { color: '#fff', h: 4, ext: 1.5 } });
  c.fillStyle = B; c.beginPath(); c.ellipse(0, -18, 10, 12, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = BL; c.beginPath(); c.ellipse(4, -16.5, 4.5, 6.5, 0, 0, 7); c.fill();
  c.save(); c.strokeStyle = BD; c.lineWidth = 2;       // pręgi
  for (const sy of [-23, -18.5, -14]) { c.beginPath(); c.moveTo(-9.5, sy); c.lineTo(-5, sy + 1); c.stroke(); }
  c.restore();
  ears(c, [[-9, -43, -8.5, -58, 0, -48], [2, -48, 9.5, -59, 12.5, -44]], B, PINK);
  c.fillStyle = B; c.beginPath(); c.ellipse(2, -38, 12, 11, 0, 0, 7); c.fill(); c.stroke();
  c.save(); c.strokeStyle = BD; c.lineWidth = 2;
  for (const sx of [-3, 1]) { c.beginPath(); c.moveTo(sx, -48.3); c.lineTo(sx + 0.8, -44.5); c.stroke(); }
  c.restore();
  c.fillStyle = BL; c.beginPath(); c.ellipse(9.5, -34.5, 5.5, 4, 0, 0, 7); c.fill();
  c.fillStyle = PINK; c.beginPath(); c.moveTo(12.3, -36.8); c.lineTo(15.8, -36.8); c.lineTo(14, -34.4); c.closePath(); c.fill();
  c.save(); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 0.9;
  for (const dy of [-1.2, 1]) { c.beginPath(); c.moveTo(11, -33.5 + dy); c.lineTo(22, -34 + dy * 2.4); c.stroke(); }
  c.restore();
  eye(c, p, 6, -41, { rx: 3.4, ry: 4.2, white: '#d8f24a', slit: true });
  c.fillStyle = RED; rr(-8, -30.5, 18, 5, 2.5); c.fill(); c.stroke();
  c.fillStyle = '#ffd24a'; c.beginPath(); c.arc(5, -25, 2.9, 0, 7); c.fill(); c.stroke();
  arm(c, p, { x: 1, y: -23, len: 8, color: BD, w: 4 });
}

const CHARS = [
  { id: 'fox', name: 'Rudy', tag: 'lis w szaliku', draw: drawFox },
  { id: 'penguin', name: 'Kra', tag: 'pingwin w nausznikach', draw: drawPenguin },
  { id: 'frog', name: 'Kumka', tag: 'żaba w koronie', draw: drawFrog },
  { id: 'robot', name: 'Zgrzyt', tag: 'robot z odrzutem', draw: drawRobot },
  { id: 'cat', name: 'Figa', tag: 'kotka z dzwoneczkiem', draw: drawCat },
];

function drawHero(h, t, kind) {
  const c = ctx;
  const air = h.onFloor < 0;
  const run = air ? 0 : Math.min(1, Math.abs(h.vx) / 220);
  const sq = h.squash + (air || run > 0.05 ? 0 : Math.sin(t * 3) * 0.035);
  c.save();
  c.translate(h.x, h.y);
  c.scale(h.face * (1 + 0.22 * sq), 1 - 0.25 * sq);
  if (h.spin) { c.translate(0, -24); c.rotate(h.angle); c.translate(0, 24); }
  c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = 1.6;
  CHARS[kind].draw(c, { t, air, run, ph: h.runPhase, rise: clamp(-h.vy / 1000, -1, 1), vxl: h.vx * h.face, speed: Math.abs(h.vx), vy: h.vy });
  c.restore();
}

// ───────────────────────── sterowanie ─────────────────────────
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump',
};
const down = new Set();
const touch = { left: false, right: false, jump: false };
const pad = { left: false, right: false, jump: false, up: false, down: false };
const input = {
  edge: false,                         // świeże wciśnięcie „akcji” (menu)
  get left()  { return held('left'); },
  get right() { return held('right'); },
  get jump()  { return held('jump'); },
  takeEdge()  { const e = this.edge; this.edge = false; return e; },
};
function held(act) {
  if (touch[act] || pad[act]) return true;
  for (const code of down) if (KEYMAP[code] === act) return true;
  return false;
}

addEventListener('keydown', (e) => {
  sfx.unlock();
  const act = KEYMAP[e.code];
  if (act || e.code === 'ArrowDown' || e.code === 'KeyS') e.preventDefault();
  if (e.repeat) return;
  if (game.state === 'title') {
    if (act === 'left') game.pick('char', -1);
    else if (act === 'right') game.pick('char', 1);
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') game.pick('style', -1);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') game.pick('style', 1);
  }
  if (act) down.add(e.code);
  if (e.code === 'Space' || e.code === 'Enter') input.edge = true;
  else if (e.code === 'KeyP') game.togglePause();
  else if (e.code === 'KeyT' && game.state === 'title') toggleTilt();
  else if (e.code === 'Escape') { if (game.state === 'over' || game.state === 'pause') game.toTitle(); else game.pause(); }
  else if (e.code === 'KeyM') {
    sfx.muted = !sfx.muted;
    game.say(sfx.muted ? 'DŹWIĘK WYŁ.' : 'DŹWIĘK WŁ.', '', 'hint', 1);
  }
});
addEventListener('keyup', (e) => { down.delete(e.code); });
addEventListener('blur', () => { down.clear(); game.pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) game.pause(); });

// menu obsługuje „click” (a nie pointerdown), bo iOS pozwala poprosić o dostęp do czujników tylko z kliknięcia
canvas.addEventListener('click', (e) => {
  sfx.unlock();
  const r = canvas.getBoundingClientRect();
  game.pointer((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
});

// ───────────────────────── przechył (żyroskop) + dotyk ─────────────────────────
const TILT = { dead: 3, full: 13, smooth: 0.45 };   // stopnie: martwa strefa i wychylenie dające pełny bieg
const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
const tilt = { want: false, active: false, seen: false, listening: false, axis: 0 };

// Boczne wychylenie ekranu w stopniach. Liczone z wektora grawitacji, a nie wprost z kąta gamma,
// dzięki czemu działa tak samo w pionie, w poziomie i z telefonem trzymanym „na płasko”.
function tiltDegrees(beta, gamma, angle) {
  const b = beta * Math.PI / 180, g = gamma * Math.PI / 180;
  const ux = -Math.cos(b) * Math.sin(g), uy = Math.sin(b);          // „góra” świata w układzie urządzenia
  const a = mod(Math.round(angle / 90) * 90, 360);                   // obrót ekranu
  const s = a === 0 ? -ux : a === 90 ? uy : a === 180 ? ux : -uy;
  return Math.asin(clamp(s, -1, 1)) * 180 / Math.PI;
}
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  tilt.seen = true;
  const deg = tiltDegrees(e.beta, e.gamma, screen.orientation?.angle ?? window.orientation ?? 0);
  const mag = clamp((Math.abs(deg) - TILT.dead) / (TILT.full - TILT.dead), 0, 1);
  tilt.axis += (Math.sign(deg) * mag - tilt.axis) * (1 - TILT.smooth);
}
function setTilt(on) {
  tilt.active = on; tilt.axis = 0;
  if (!on) { taps.clear(); touch.jump = false; }
  document.body.classList.toggle('tilt', on);
}
async function enableTilt() {
  try {
    const D = window.DeviceOrientationEvent;
    if (!D) throw new Error('no-sensor');
    if (typeof D.requestPermission === 'function' && (await D.requestPermission()) !== 'granted') throw new Error('denied');
    if (!tilt.listening) { addEventListener('deviceorientation', onOrient); tilt.listening = true; }
    tilt.seen = false;
    setTilt(true);
    setTimeout(() => {                                 // czujnik milczy (komputer, brak HTTPS) → wracamy do przycisków
      if (tilt.active && !tilt.seen) { tilt.want = false; setTilt(false); game.savePrefs(); game.say('BRAK CZUJNIKA', 'przechył wymaga telefonu i strony po HTTPS', 'warn', 2.6); }
    }, 1500);
  } catch (err) {
    tilt.want = false; setTilt(false); game.savePrefs();
    game.say(err.message === 'denied' ? 'BRAK ZGODY' : 'BRAK CZUJNIKA', err.message === 'denied' ? 'zezwól stronie na dostęp do ruchu urządzenia' : 'zostają przyciski ekranowe', 'warn', 2.6);
  }
}
function toggleTilt() {
  sfx.pick();
  tilt.want = !tilt.active;
  if (tilt.want) enableTilt(); else setTilt(false);
  game.savePrefs();
}

// w trybie przechyłu każde dotknięcie ekranu to skok (przytrzymanie = skacz przy każdym lądowaniu)
const taps = new Set();
addEventListener('pointerdown', (e) => {
  sfx.unlock();
  if (!tilt.active) return;
  taps.add(e.pointerId); touch.jump = true;
});
for (const ev of ['pointerup', 'pointercancel']) {
  addEventListener(ev, (e) => { if (taps.delete(e.pointerId) && taps.size === 0) touch.jump = false; });
}
for (const btn of document.querySelectorAll('.pad button')) {
  const act = btn.dataset.act;
  const set = (v) => { touch[act] = v; btn.classList.toggle('on', v); };
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault(); sfx.unlock();
    try { btn.setPointerCapture(e.pointerId); } catch {}
    set(true);
    if (act === 'jump') input.edge = true;
    else if (game.state === 'title') game.pick('char', act === 'left' ? -1 : 1);
  });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, () => set(false));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}

function pollGamepad() {
  const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
  const was = { ...pad };
  pad.left = pad.right = pad.jump = pad.up = pad.down = false;
  if (!gp) return;
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  pad.left = ax < -0.35 || !!gp.buttons[14]?.pressed;
  pad.right = ax > 0.35 || !!gp.buttons[15]?.pressed;
  pad.up = ay < -0.5 || !!gp.buttons[12]?.pressed;
  pad.down = ay > 0.5 || !!gp.buttons[13]?.pressed;
  pad.jump = !!gp.buttons[0]?.pressed || !!gp.buttons[1]?.pressed;
  if (pad.jump && !was.jump) { sfx.unlock(); input.edge = true; }
  if (game.state === 'title') {
    if (pad.left && !was.left) game.pick('char', -1);
    if (pad.right && !was.right) game.pick('char', 1);
    if (pad.up && !was.up) game.pick('style', -1);
    if (pad.down && !was.down) game.pick('style', 1);
  }
}

// ───────────────────────── zapis ─────────────────────────
const STORE = 'stepjumper.best.v1', PREFS = 'stepjumper.prefs.v1';
function loadJSON(key, def) {
  try { return { ...def, ...JSON.parse(localStorage.getItem(key) || '{}') }; } catch { return { ...def }; }
}
function saveJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }

// układ ekranu wyboru (wspólny dla rysowania i dotyku)
const slotX = (i) => 168 + i * 76;
const UIBOX = {
  chars: { y: 124, h: 74 }, maps: { y: 262, h: 40 }, play: { x: 200, y: 346, w: 240, h: 38 },
  ctrl: { x: 150, y: 391, w: 340, h: 27 }, menu: { x: 180, y: 384, w: 280, h: 30 },
};
const inBox = (x, y, b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

// ───────────────────────── gra ─────────────────────────
class Game {
  constructor() {
    this.best = loadJSON(STORE, { score: 0, floor: 0, combo: 0 });
    const prefs = loadJSON(PREFS, { char: 0, style: 0, tilt: false });
    this.charIdx = clamp(prefs.char | 0, 0, CHARS.length - 1);
    this.styleIdx = clamp(prefs.style | 0, 0, STYLES.length - 1);
    tilt.want = !!prefs.tilt;
    this.applyStyle();
    this.t = 0;
    this.snow = Array.from({ length: 34 }, () => ({ x: rand(LEFT, RIGHT), y: rand(0, H), r: rand(0.8, 2.2), s: rand(12, 34), ph: rand(0, 7) }));
    this.reset();
    this.state = 'title';
  }

  applyStyle() {
    style = STYLES[this.styleIdx]; ui = style.ui; FONT = style.font || BASE_FONT;
    canvas.style.filter = style.filter || '';
  }
  pick(what, d, abs = false) {
    if (what === 'char') this.charIdx = abs ? d : mod(this.charIdx + d, CHARS.length);
    else { this.styleIdx = abs ? d : mod(this.styleIdx + d, STYLES.length); this.applyStyle(); }
    this.savePrefs();
    sfx.pick();
  }
  savePrefs() { saveJSON(PREFS, { char: this.charIdx, style: this.styleIdx, tilt: tilt.want }); }

  reset() {
    this.floors = new Map(); this.genN = 0; this.lowN = 0;
    this.camY = -(H - 40);
    this.hero = { x: W / 2, y: 0, vx: 0, vy: 0, face: 1, onFloor: 0, from: 0, spin: false, angle: 0, squash: 0, runPhase: 0 };
    this.maxFloor = 0; this.bonus = 0; this.bestCombo = 0;
    this.combo = { floors: 0, jumps: 0, timer: 0 };
    this.scrolling = false; this.level = 0; this.clock = 0; this.hurries = 0;
    this.shake = 0; this.parts = []; this.msgs = [];
    this.acc = 0; this.trailT = 0; this.jumpLock = true; this.newBest = false; this.overT = 0;
    this.ensureFloors();
  }

  get score() { return this.maxFloor * 10 + this.bonus; }
  get speed() { return this.scrolling ? 30 + 28 * (this.level - 1) : 0; }

  start() {
    this.reset(); this.state = 'play';
    if (tilt.active) navigator.wakeLock?.request('screen').catch(() => {});   // ekran nie gaśnie w trakcie gry
  }
  toTitle() { this.reset(); this.state = 'title'; }
  pause() { if (this.state === 'play') this.state = 'pause'; }
  togglePause() {
    if (this.state === 'play') this.state = 'pause';
    else if (this.state === 'pause') { this.state = 'play'; this.jumpLock = true; }
  }

  pointer(x, y) {
    if (this.state === 'title') {
      for (let i = 0; i < 5; i++) {
        if (Math.abs(x - slotX(i)) <= 34) {
          if (y >= UIBOX.chars.y && y <= UIBOX.chars.y + UIBOX.chars.h) return this.pick('char', i, true);
          if (y >= UIBOX.maps.y - 4 && y <= UIBOX.maps.y + UIBOX.maps.h + 4) return this.pick('style', i, true);
        }
      }
      if (inBox(x, y, UIBOX.play)) this.start();
      else if ((isTouch || tilt.active) && inBox(x, y, UIBOX.ctrl)) toggleTilt();
    } else if (this.state === 'pause') {
      this.togglePause();
    } else if (this.state === 'over' && this.overT > 0.6) {
      if (inBox(x, y, UIBOX.menu)) this.toTitle(); else this.start();
    }
  }

  say(title, sub = '', color = 'gold', dur = 1.6) { this.msgs.push({ title, sub, color, dur, t: 0 }); if (this.msgs.length > 3) this.msgs.shift(); }

  // ── piętra ──
  makeFloor(n) {
    if (n % 50 === 0) return { n, x: LEFT, w: FIELD, y: -n * GAP };   // co 50. piętro na całą szerokość
    const w = 32 * (4 + Math.floor(Math.random() * 6));               // 128–288 px
    const x = Math.round(LEFT + Math.random() * (FIELD - w));
    return { n, x, w, y: -n * GAP };
  }
  ensureFloors() {
    const topN = Math.ceil((-this.camY + GAP) / GAP);
    while (this.genN <= topN) { this.floors.set(this.genN, this.makeFloor(this.genN)); this.genN++; }
    while (this.lowN < this.genN && -this.lowN * GAP - this.camY > H + 40) this.floors.delete(this.lowN++);
  }

  // ── cząsteczki ──
  puff(x, y, n, { color = '#fff', sx = 120, sy = 80, up = 60, life = 0.4, size = 3, g = 300, star = false } = {}) {
    for (let i = 0; i < n; i++) {
      this.parts.push({ x, y, vx: rand(-sx, sx), vy: rand(-sy, sy) - up, life: life * rand(0.6, 1.2), max: life, size: size * rand(0.6, 1.3), color, g, star, rot: rand(0, 7) });
    }
  }
  dustColor(n) {
    return style.world === 'neon' ? cycle(NEON, n) : style.world === 'sketch' ? 'rgba(31,42,68,.55)' : themeOf(n).top;
  }

  // ── combo ──
  endCombo() {
    const c = this.combo;
    if (c.jumps >= 2) {
      const pts = c.floors * c.floors;
      this.bonus += pts;
      this.bestCombo = Math.max(this.bestCombo, c.floors);
      const ti = TIERS.findIndex(([min]) => c.floors >= min);
      const label = ti >= 0 ? TIERS[ti][1] : 'COMBO!';
      this.say(label, `combo ${c.floors} pięter  ·  +${pts}`, 'gold', 1.8);
      sfx.combo(TIERS.length - 1 - ti);
    }
    c.floors = 0; c.jumps = 0; c.timer = 0;
  }

  land(n) {
    const h = this.hero;
    const diff = n - h.from;
    h.y = -n * GAP; h.vy = 0; h.onFloor = n; h.from = n;
    h.spin = false; h.angle = 0; h.squash = 0.9;
    this.puff(h.x, h.y, 6, { color: this.dustColor(n), sx: 110, sy: 20, up: 50, life: 0.35 });
    sfx.land();

    if (diff >= 2) {                       // skok o 2+ piętra: buduje combo i odnawia licznik
      this.combo.floors += diff; this.combo.jumps++; this.combo.timer = COMBO_TIME;
    } else if (diff === 1 || diff < 0) {   // jedno piętro albo upadek niżej: koniec combo
      this.endCombo();
    }
    if (n > this.maxFloor) this.maxFloor = n;
    if (!this.scrolling && n >= START_FLOOR) { this.scrolling = true; this.level = 1; this.clock = 0; }
  }

  gameOver() {
    this.state = 'over'; this.overT = 0; this.msgs = [];
    this.combo.floors = 0; this.combo.jumps = 0; this.combo.timer = 0;   // przerwane combo przepada
    sfx.over();
    const b = this.best;
    this.newBest = this.score > b.score && this.score > 0;
    b.score = Math.max(b.score, this.score);
    b.floor = Math.max(b.floor, this.maxFloor);
    b.combo = Math.max(b.combo, this.bestCombo);
    saveJSON(STORE, b);
  }

  // ── jeden krok fizyki ──
  step(dt) {
    const h = this.hero;
    if (this.jumpLock && !input.jump) this.jumpLock = false;
    const wantJump = input.jump && !this.jumpLock;
    // klawisze/przyciski dają pełne ±1; przechył daje wartość płynną, czyli słabsze lub mocniejsze przyspieszenie
    let axis = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (!axis && tilt.active && Math.abs(tilt.axis) > 0.02) axis = tilt.axis;
    const dir = Math.sign(axis);
    const grounded = h.onFloor >= 0;

    // bieg z rozpędem
    if (dir) {
      const turning = h.vx * dir < 0;
      h.vx += axis * P.accel * (turning ? P.turn : 1) * dt;
      h.face = dir;
    } else {
      const f = (grounded ? P.fricGround : P.fricAir) * dt;
      h.vx = Math.abs(h.vx) <= f ? 0 : h.vx - Math.sign(h.vx) * f;
    }
    h.vx = clamp(h.vx, -P.maxVx, P.maxVx);
    h.x += h.vx * dt;

    // odbicie od ściany – prędkość zostaje, zmienia się kierunek
    if (h.x - HW < LEFT || h.x + HW > RIGHT) {
      const left = h.x - HW < LEFT;
      h.x = left ? LEFT + HW : RIGHT - HW;
      if ((left && h.vx < 0) || (!left && h.vx > 0)) {
        if (Math.abs(h.vx) > 140) {
          sfx.bounce();
          this.puff(left ? LEFT : RIGHT, h.y - 24, 7, { color: this.dustColor(Math.max(0, h.from)), sx: 60, sy: 140, up: 0, life: 0.35, size: 2.5 });
          if (!dir) h.face = left ? 1 : -1;
        }
        h.vx = -h.vx;
      }
    }

    if (h.onFloor >= 0) {
      const p = this.floors.get(h.onFloor);
      if (!p || h.x + FOOT < p.x || h.x - FOOT > p.x + p.w) {
        h.onFloor = -1;                                   // zejście z krawędzi
      } else if (wantJump) {                              // trzymany skok = skok od razu po lądowaniu
        const k = Math.abs(h.vx) / P.maxVx;
        h.vy = -(P.jumpBase + P.jumpBoost * Math.pow(k, P.jumpPow));
        h.onFloor = -1; h.squash = -0.6;
        h.spin = k >= P.spinAt; h.angle = 0;
        sfx.jump(k);
      }
      h.runPhase += Math.abs(h.vx) * dt * 0.085;
    }

    if (h.onFloor < 0) {
      const prevY = h.y;
      h.vy = Math.min(h.vy + P.gravity * dt, P.maxFall);
      h.y += h.vy * dt;
      if (h.vy > 0) {                                     // platformy są jednostronne – lądujemy tylko z góry
        const nHi = Math.floor(-prevY / GAP + 1e-9), nLo = Math.ceil(-h.y / GAP - 1e-9);
        for (let n = nHi; n >= nLo; n--) {
          const p = this.floors.get(n);
          if (p && h.x + FOOT >= p.x && h.x - FOOT <= p.x + p.w) { this.land(n); break; }
        }
      }
      if (h.spin) {
        h.angle += dt * 15;
        this.trailT -= dt;
        if (this.trailT <= 0) {
          this.trailT = 0.03;
          const cols = style.world === 'sketch' ? PENCILS : ['#ffe066', '#7ef0e0', '#ff9ecb', '#ffffff'];
          this.puff(h.x, h.y - 24, 1, { color: cols[Math.floor(Math.random() * cols.length)], sx: 40, sy: 40, up: 0, life: 0.5, size: 5, g: 120, star: true });
        }
      }
    }
    h.squash += (0 - h.squash) * Math.min(1, 12 * dt);

    // licznik combo
    if (this.combo.timer > 0) {
      this.combo.timer -= dt;
      if (this.combo.timer <= 0) this.endCombo();
    }

    // kamera: stałe przewijanie + pogoń za bohaterem
    if (this.scrolling) {
      this.camY -= this.speed * dt;
      if (this.hurries < MAX_HURRIES) {
        this.clock += dt;
        if (this.clock >= HURRY_EVERY) {
          this.clock -= HURRY_EVERY; this.hurries++; this.level++;
          if (this.hurries >= MAX_HURRIES) this.clock = 0;
          this.say('SZYBCIEJ!', '', 'warn', 1.5);
          this.shake = 0.6; sfx.hurry();
        }
      }
    }
    const target = h.y - FOLLOW;
    if (target < this.camY) this.camY += (target - this.camY) * (1 - Math.exp(-7 * dt));
    this.ensureFloors();

    // cząsteczki
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.rot += dt * 6;
      if (p.life <= 0) this.parts.splice(i, 1);
    }

    // spadł poniżej ekranu
    if (h.y - HERO_H - this.camY > H) this.gameOver();
  }

  frame(dt) {
    this.t += dt;
    const edge = input.takeEdge();
    const camBefore = this.camY;
    if (this.state === 'title') { if (edge) this.start(); }
    else if (this.state === 'pause') { if (edge) this.togglePause(); }
    else if (this.state === 'over') { this.overT += dt; if (edge && this.overT > 0.6) this.start(); }
    else {
      this.acc += dt;
      while (this.acc >= STEP && this.state === 'play') { this.step(STEP); this.acc -= STEP; }
    }
    // efekty niezależne od fizyki
    if (this.state !== 'pause') {
      for (const m of this.msgs) m.t += dt;
      this.msgs = this.msgs.filter((m) => m.t < m.dur);
      this.shake = Math.max(0, this.shake - dt);
      const rise = clamp(camBefore - this.camY, 0, 200);
      for (const s of this.snow) {
        s.y += s.s * dt + rise * 0.35; s.x += Math.sin(this.t * 1.3 + s.ph) * 8 * dt;
        if (s.y > H + 4) { s.y = -4; s.x = rand(LEFT, RIGHT); }
      }
    }
    this.render();
  }

  // ───────────────────────── render ─────────────────────────
  render() {
    const mw = canvas.width, mh = canvas.height;
    if (style.pixel) {                                  // świat w niskiej rozdzielczości, powiększany bez wygładzania
      const lw = W / style.pixel, lh = H / style.pixel;
      if (lowCanvas.width !== lw) { lowCanvas.width = lw; lowCanvas.height = lh; }
      ctx = lowCtx;
      ctx.setTransform(1 / style.pixel, 0, 0, 1 / style.pixel, 0, 0);
      ctx.clearRect(0, 0, W, H);
      this.drawWorld();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = ditherPattern; ctx.fillRect(0, 0, lw, lh);
      ctx = mainCtx;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(lowCanvas, 0, 0, mw, mh);
      ctx.imageSmoothingEnabled = true;
      ctx.setTransform(mw / W, 0, 0, mh / H, 0, 0);
    } else {
      ctx = mainCtx;
      ctx.setTransform(mw / W, 0, 0, mh / H, 0, 0);
      ctx.clearRect(0, 0, W, H);
      this.drawWorld();
    }
    this.drawHud();
    if (this.state === 'title') this.drawTitle();
    else if (this.state === 'pause') this.drawPause();
    else if (this.state === 'over') this.drawOver();
    this.drawMessages();
    style.post?.(this);
  }

  drawWorld() {
    const c = ctx, camY = this.camY;
    c.save();
    if (this.shake > 0 && !reduceMotion) c.translate(rand(-1, 1) * this.shake * 6, rand(-1, 1) * this.shake * 6);

    c.save();
    c.beginPath(); c.rect(LEFT, 0, FIELD, H); c.clip();
    this.drawBackdrop();
    c.translate(0, -camY);
    for (const p of this.floors.values()) this.drawPlatform(p);
    for (const p of this.parts) {
      c.globalAlpha = clamp(p.life / p.max, 0, 1);
      c.fillStyle = p.color;
      if (p.star) { burst(p.x, p.y, p.size * 0.45, p.size, 4, p.rot); c.fill(); }
      else { c.beginPath(); c.arc(p.x, p.y, p.size, 0, 7); c.fill(); }
    }
    c.globalAlpha = 1;
    const h = this.hero;
    if (style.world === 'neon') {                      // poświata, żeby postać nie ginęła w ciemności
      const g = c.createRadialGradient(h.x, h.y - 26, 4, h.x, h.y - 26, 44);
      g.addColorStop(0, 'rgba(255,255,255,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.fillRect(h.x - 46, h.y - 72, 92, 92);
    }
    drawHero(h, this.t, this.charIdx);
    c.restore();

    this.drawWalls();
    const danger = c.createLinearGradient(0, H - 70, 0, H);   // strefa zagrożenia na dole
    danger.addColorStop(0, `rgba(${ui.dim},0)`); danger.addColorStop(1, `rgba(${ui.dim},.78)`);
    c.fillStyle = danger; c.fillRect(LEFT, H - 70, FIELD, 70);
    c.restore();
  }

  // ── tło ──
  drawBackdrop() {
    const c = ctx, t = this.t, bgY = this.camY * 0.5;      // paralaksa
    const kLo = Math.max(0, Math.ceil((-260 - bgY - H - 120) / 440)), kHi = Math.floor((-260 - bgY + 140) / 440);

    if (style.world === 'neon') {
      const g = c.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0b0222'); g.addColorStop(1, '#210744');
      c.fillStyle = g; c.fillRect(LEFT, 0, FIELD, H);
      c.fillStyle = 'rgba(255,94,224,.16)';
      for (let x = LEFT + 32; x < RIGHT; x += 32) c.fillRect(x, 0, 1, H);
      for (let y = -mod(bgY, 32); y < H; y += 32) c.fillRect(LEFT, y, FIELD, 1);
      for (const s of this.snow) {
        c.fillStyle = s.ph > 3.5 ? 'rgba(94,245,255,.7)' : 'rgba(255,94,224,.7)';
        c.fillRect(s.x, H - s.y, s.r, s.r);
      }
      return;
    }

    if (style.world === 'sketch') {
      c.fillStyle = '#f7f2e4'; c.fillRect(LEFT, 0, FIELD, H);
      c.fillStyle = 'rgba(70,120,200,.2)';
      for (let x = LEFT + 16; x < RIGHT; x += 16) c.fillRect(x, 0, 1, H);
      for (let y = -mod(bgY, 16); y < H; y += 16) c.fillRect(LEFT, y, FIELD, 1);
      c.save();
      c.strokeStyle = 'rgba(31,42,68,.3)'; c.fillStyle = 'rgba(31,42,68,.38)'; c.lineWidth = 1.6; c.lineCap = 'round'; c.lineJoin = 'round';
      for (let k = kLo; k <= kHi; k++) {                   // bazgroły na marginesie zeszytu
        const x = k % 2 ? LEFT + 70 : RIGHT - 120, y = -260 - k * 440 - bgY;
        c.beginPath();
        if (k % 4 === 0) {
          c.moveTo(x, y + 44); c.lineTo(x + 2, y); c.moveTo(x - 9, y + 13); c.lineTo(x + 2, y); c.lineTo(x + 12, y + 12); c.stroke();
          c.save(); c.translate(x + 40, y + 26); c.rotate(-0.12);
          c.font = `700 14px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('wyżej!', 0, 0);
          c.restore();
        } else if (k % 4 === 1) {
          burst(x + 20, y + 24, 8, 19, 5, -Math.PI / 2); c.stroke();
        } else if (k % 4 === 2) {
          c.arc(x, y + 24, 10, Math.PI, 0); c.arc(x + 17, y + 17, 13, Math.PI * 1.1, -0.1); c.arc(x + 34, y + 24, 10, Math.PI, 0);
          c.closePath(); c.stroke();
        } else {
          for (let a = 0; a < 13; a += 0.3) c.lineTo(x + 20 + Math.cos(a) * a * 1.7, y + 24 + Math.sin(a) * a * 1.7);
          c.stroke();
        }
      }
      c.restore();
      return;
    }

    // „Zamieć” (także pod filtrami: Stare kino, Retro LCD)
    c.save(); c.translate(0, -mod(bgY, 32)); c.fillStyle = brickPattern; c.fillRect(LEFT - 64, -32, FIELD + 128, H + 96); c.restore();
    for (let k = kLo; k <= kHi; k++) this.drawWindow(k % 2 ? LEFT + 70 : RIGHT - 122, -260 - k * 440 - bgY, k);
    const shade = c.createLinearGradient(LEFT, 0, RIGHT, 0);
    shade.addColorStop(0, 'rgba(5,8,25,.55)'); shade.addColorStop(0.18, 'rgba(5,8,25,0)');
    shade.addColorStop(0.82, 'rgba(5,8,25,0)'); shade.addColorStop(1, 'rgba(5,8,25,.55)');
    c.fillStyle = shade; c.fillRect(LEFT, 0, FIELD, H);
    c.fillStyle = 'rgba(255,255,255,.55)';
    for (const s of this.snow) { c.beginPath(); c.arc(s.x, s.y, s.r, 0, 7); c.fill(); }
  }

  drawWindow(x, y, k) {
    const c = ctx;
    const glow = c.createRadialGradient(x + 26, y + 50, 5, x + 26, y + 50, 120);
    glow.addColorStop(0, 'rgba(140,200,255,.22)'); glow.addColorStop(1, 'rgba(140,200,255,0)');
    c.fillStyle = glow; c.fillRect(x - 100, y - 80, 252, 260);
    const arch = (ix) => { c.beginPath(); c.moveTo(x + ix, y + 84); c.lineTo(x + ix, y + 26); c.arc(x + 26, y + 26, 26 - ix, Math.PI, 0); c.lineTo(x + 52 - ix, y + 84); c.closePath(); };
    arch(0); c.fillStyle = '#0d1230'; c.fill();
    arch(5);
    const sky = c.createLinearGradient(0, y, 0, y + 84);
    sky.addColorStop(0, '#1d3f86'); sky.addColorStop(1, '#6fb4ee');
    c.fillStyle = sky; c.fill();
    c.save(); c.clip();
    c.fillStyle = '#fdf6d0'; c.beginPath(); c.arc(x + 18 + hash(k) * 18, y + 26 + hash(k, 2) * 12, 6, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.8)';
    for (let i = 0; i < 4; i++) c.fillRect(x + 8 + hash(k, i + 5) * 36, y + 8 + hash(k, i + 9) * 60, 1.4, 1.4);
    c.restore();
    c.fillStyle = '#0d1230'; c.fillRect(x + 24.5, y + 2, 3, 82); c.fillRect(x + 4, y + 46, 44, 3);
    c.fillStyle = '#3a4478'; rr(x - 6, y + 83, 64, 7, 2); c.fill();
    c.fillStyle = '#eaf6ff'; rr(x - 5, y + 81, 62, 4, 2); c.fill();
  }

  // ── platformy ──
  drawPlatform(p) {
    const c = ctx, y = p.y, cx = p.x + p.w / 2;
    const signed = p.n > 0 && p.n % 10 === 0;              // tabliczka z numerem co 10 pięter

    if (style.world === 'neon') {
      const col = cycle(NEON, p.n);
      c.save();
      c.shadowColor = col; c.shadowBlur = 14;
      c.fillStyle = '#14062e'; rr(p.x, y, p.w, PLAT_H - 4, 4); c.fill();
      c.strokeStyle = col; c.lineWidth = 2; c.stroke();
      c.restore();
      c.globalAlpha = 0.5; c.fillStyle = col; c.fillRect(p.x + 7, y + PLAT_H - 10, p.w - 14, 1.5); c.globalAlpha = 1;
      if (signed) text(String(p.n), cx, y + PLAT_H + 9, { size: 12, color: col, stroke: '#12002b', sw: 3 });
      return;
    }

    if (style.world === 'sketch') {
      const seed = p.n * 17 + (reduceMotion ? 0 : Math.floor(this.t * 5)), col = cycle(PENCILS, p.n);
      wobblyRect(p.x, y, p.w, PLAT_H - 3, seed);
      c.fillStyle = '#fffdf6'; c.fill();
      c.save(); c.clip();
      c.strokeStyle = col; c.globalAlpha = 0.8; c.lineWidth = 1.4; c.beginPath();
      for (let hx = p.x - 20; hx < p.x + p.w; hx += 7) { c.moveTo(hx, y + PLAT_H); c.lineTo(hx + 16, y - 2); }
      c.stroke();
      c.restore();
      c.strokeStyle = PEN; c.lineJoin = 'round'; c.lineWidth = 2;
      wobblyRect(p.x, y, p.w, PLAT_H - 3, seed); c.stroke();
      c.globalAlpha = 0.4; c.lineWidth = 1;
      wobblyRect(p.x - 1, y - 1, p.w + 2, PLAT_H - 1, seed + 7, 1.8); c.stroke();
      c.globalAlpha = 1;
      if (signed) text(String(p.n), cx, y + PLAT_H + 8, { size: 13, color: col, stroke: '#f7f2e4', sw: 4 });
      return;
    }

    const th = themeOf(p.n);
    c.fillStyle = 'rgba(0,0,0,.3)'; rr(p.x + 3, y + 5, p.w, PLAT_H, 6); c.fill();
    if (th.decor === 'drips') {
      c.fillStyle = th.drip;
      const cnt = Math.floor(p.w / 20);
      for (let i = 0; i < cnt; i++) {
        const hx = p.x + 10 + i * 20 + (hash(p.n, i) - 0.5) * 8, len = 4 + hash(p.n, i + 50) * 13;
        c.beginPath(); c.moveTo(hx - 4, y + PLAT_H - 2); c.lineTo(hx + 4, y + PLAT_H - 2); c.lineTo(hx, y + PLAT_H + len); c.closePath(); c.fill();
      }
    }
    c.fillStyle = th.body; rr(p.x, y, p.w, PLAT_H, 6); c.fill();
    c.fillStyle = th.dark; rr(p.x, y + PLAT_H - 6, p.w, 6, [0, 0, 6, 6]); c.fill();
    if (th.decor === 'seams') {
      c.fillStyle = th.dark; c.globalAlpha = 0.55;
      for (let sx = p.x + 32; sx < p.x + p.w - 6; sx += 32) c.fillRect(sx, y + 4, 1.5, PLAT_H - 4);
      c.globalAlpha = 1;
    } else if (th.decor === 'rivets') {
      c.fillStyle = th.top;
      for (let sx = p.x + 12; sx < p.x + p.w - 6; sx += 24) { c.beginPath(); c.arc(sx, y + 10, 1.8, 0, 7); c.fill(); }
    }
    c.fillStyle = th.top; rr(p.x - 2, y - 2, p.w + 4, 7, 3.5); c.fill();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(p.x + 6, y - 0.5, p.w - 12, 1.5);
    if (signed) {
      const k = style.pixel ? 1.5 : 1;                     // w grubych pikselach tabliczka musi być większa
      c.fillStyle = '#141a40'; rr(cx - 21 * k, y + PLAT_H - 2, 42 * k, 18 * k, 5); c.fill();
      c.strokeStyle = th.top; c.lineWidth = 1.5; c.stroke();
      text(String(p.n), cx, y + PLAT_H - 2 + 9.5 * k, { size: 11 * k, color: '#ffe680', sw: 0 });
    }
  }

  // ── ściany ──
  drawWalls() {
    const c = ctx, camY = this.camY;
    if (style.world === 'neon') {
      c.fillStyle = '#0d0326'; c.fillRect(0, 0, WALL, H); c.fillRect(RIGHT, 0, WALL, H);
      c.fillStyle = 'rgba(94,245,255,.15)';
      for (const x of [0, RIGHT]) {
        for (let y = -mod(camY, 24); y < H; y += 24) c.fillRect(x, y, WALL, 1);
        c.fillRect(x + 32, 0, 1, H); c.fillRect(x + 64, 0, 1, H);
      }
      c.save(); c.shadowColor = '#5ef5ff'; c.shadowBlur = 16; c.fillStyle = '#5ef5ff';
      c.fillRect(LEFT - 2.5, 0, 2.5, H); c.fillRect(RIGHT, 0, 2.5, H);
      c.restore();
      return;
    }
    if (style.world === 'sketch') {
      c.fillStyle = '#ece3cc'; c.fillRect(0, 0, WALL, H); c.fillRect(RIGHT, 0, WALL, H);
      for (const x of [0, RIGHT]) {
        c.save(); c.beginPath(); c.rect(x, 0, WALL, H); c.clip();
        c.translate(0, -mod(camY, 12)); c.fillStyle = hatchPattern; c.fillRect(x - 12, -12, WALL + 24, H + 36);
        c.restore();
      }
      c.fillStyle = PEN; c.fillRect(LEFT - 2, 0, 2, H); c.fillRect(RIGHT, 0, 2, H);
      c.fillStyle = 'rgba(200,30,30,.65)'; c.fillRect(LEFT + 3, 0, 1.5, H); c.fillRect(RIGHT - 4.5, 0, 1.5, H);
      return;
    }
    for (const x of [0, RIGHT]) {
      c.save(); c.beginPath(); c.rect(x, 0, WALL, H); c.clip();
      c.translate(0, -mod(camY, 48)); c.fillStyle = stonePattern; c.fillRect(x - 48, -48, WALL + 96, H + 144);
      c.restore();
    }
    c.fillStyle = '#12173a'; c.fillRect(LEFT - 5, 0, 5, H); c.fillRect(RIGHT, 0, 5, H);
    c.fillStyle = '#9fd8ff'; c.fillRect(LEFT - 1.5, 0, 1.5, H); c.fillRect(RIGHT, 0, 1.5, H);
  }

  // ── HUD ──
  drawHud() {
    const c = ctx, t = this.t;
    // zegar
    const cx = 48, cy = 50, ringing = this.msgs.some((m) => m.title === 'SZYBCIEJ!');
    c.save();
    if (ringing && !reduceMotion) c.translate(Math.sin(t * 60) * 2, 0);
    c.fillStyle = ui.frame; c.beginPath(); c.arc(cx, cy, 33, 0, 7); c.fill();
    c.fillStyle = '#ffd24a'; c.beginPath(); c.arc(cx, cy, 30, 0, 7); c.fill();
    c.fillStyle = '#fff8e1'; c.beginPath(); c.arc(cx, cy, 25, 0, 7); c.fill();
    c.strokeStyle = '#12173a'; c.lineWidth = 2; c.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6, r0 = i % 3 ? 21 : 18;
      c.beginPath(); c.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); c.lineTo(cx + Math.cos(a) * 23, cy + Math.sin(a) * 23); c.stroke();
    }
    const broken = this.hurries >= MAX_HURRIES;
    const ha = -Math.PI / 2 + (broken ? 2.2 + Math.sin(t * 40) * 0.06 : (this.clock / HURRY_EVERY) * Math.PI * 2);
    c.strokeStyle = '#e5482f'; c.lineWidth = 3.5;
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ha) * 19, cy + Math.sin(ha) * 19); c.stroke();
    c.fillStyle = '#12173a'; c.beginPath(); c.arc(cx, cy, 3.5, 0, 7); c.fill();
    c.restore();
    text(this.scrolling ? `TEMPO ${this.level}` : 'TEMPO –', cx, 96, { size: 11, color: ui.hint, sw: 3, maxW: 88 });

    // miernik combo
    const mx = 38, my = 122, mw = 20, mh = 170, frac = clamp(this.combo.timer / COMBO_TIME, 0, 1);
    text('COMBO', cx, 112, { size: 10, color: ui.hint, sw: 3 });
    c.fillStyle = ui.frame; rr(mx - 3, my - 3, mw + 6, mh + 6, 8); c.fill();
    c.fillStyle = ui.meterBg; rr(mx, my, mw, mh, 6); c.fill();
    if (frac > 0) {
      const g = c.createLinearGradient(0, my + mh, 0, my);
      g.addColorStop(0, '#ff5a3c'); g.addColorStop(0.5, '#ffb52e'); g.addColorStop(1, '#fff07a');
      c.fillStyle = g; rr(mx, my + mh * (1 - frac), mw, mh * frac, 6); c.fill();
    }
    c.fillStyle = 'rgba(255,255,255,.18)'; rr(mx + 3, my + 3, 4, mh - 6, 2); c.fill();
    const active = this.combo.floors > 0;
    burst(cx, 332, 20, 31, 10, t * (active ? 1.6 : 0.2));
    c.fillStyle = active ? '#ffd24a' : ui.off; c.fill();
    c.strokeStyle = ui.frame; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();
    text(String(this.combo.floors), cx, 333, { size: 18, color: active ? '#fff' : ui.offText, stroke: active ? '#12173a' : ui.off, sw: 4 });
    if (active) text('pięter', cx, 372, { size: 10, color: ui.note, sw: 3 });

    // wynik
    const rx = RIGHT + WALL / 2;
    c.fillStyle = ui.panel; rr(RIGHT + 9, 10, WALL - 18, 152, 10); c.fill();
    text('WYNIK', rx, 26, { size: 10, color: ui.label, sw: 0 });
    text(String(this.score), rx, 46, { size: 20, color: ui.gold, sw: 3, maxW: 70 });
    text('PIĘTRO', rx, 74, { size: 10, color: ui.label, sw: 0 });
    text(String(this.maxFloor), rx, 94, { size: 20, sw: 3, maxW: 70 });
    text('REKORD', rx, 122, { size: 10, color: ui.label, sw: 0 });
    text(String(Math.max(this.best.score, this.score)), rx, 141, { size: 15, color: ui.mint, sw: 3, maxW: 70 });
    if (sfx.muted) text('🔇', rx, 182, { size: 16, sw: 0 });

    // wskaźnik przechyłu: kropka pokazuje, jak mocno i w którą stronę gra „czyta” telefon
    if (tilt.active && this.state === 'play') {
      const bx = W / 2, by = H - 13;
      c.fillStyle = ui.panel; rr(bx - 64, by - 5, 128, 10, 5); c.fill();
      c.strokeStyle = ui.line; c.lineWidth = 1; c.stroke();
      c.fillStyle = ui.line; c.fillRect(bx - 0.75, by - 5, 1.5, 10);
      c.fillStyle = ui.gold; c.beginPath(); c.arc(bx + tilt.axis * 58, by, 6, 0, 7); c.fill();
      c.strokeStyle = ui.frame; c.lineWidth = 1.5; c.stroke();
    }
  }

  drawMessages() {
    const c = ctx;
    this.msgs.forEach((m, i) => {
      const a = clamp((m.dur - m.t) / 0.3, 0, 1), s = easeOutBack(clamp(m.t / 0.25, 0, 1));
      c.save();
      c.globalAlpha = a;
      c.translate(W / 2, 128 + i * 62 - m.t * 10); c.rotate(-0.05); c.scale(s, s);
      const size = Math.min(40, 400 / Math.max(6, m.title.length) * 1.25);
      text(m.title, 0, 0, { size, color: ui[m.color] || ui.gold, sw: 7, maxW: 420 });
      if (m.sub) text(m.sub, 0, 30, { size: 14, sw: 4 });
      c.restore();
    });
  }

  dim(a) { ctx.fillStyle = `rgba(${ui.dim},${a})`; ctx.fillRect(0, 0, W, H); }
  panel(x, y, w, h) {
    ctx.fillStyle = ui.panel; rr(x, y, w, h, 14); ctx.fill();
    ctx.strokeStyle = ui.line; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // miniatura mapy na ekranie wyboru
  drawSwatch(i, x, y, w, h) {
    const c = ctx, id = STYLES[i].id;
    c.save(); rr(x, y, w, h, 7); c.clip();
    const plat = (fill, top) => { c.fillStyle = fill; rr(x + 12, y + 20, w - 24, 9, 3); c.fill(); if (top) { c.fillStyle = top; rr(x + 11, y + 19, w - 22, 4, 2); c.fill(); } };
    if (id === 'ice') {
      c.fillStyle = '#222a52'; c.fillRect(x, y, w, h);
      c.fillStyle = '#151a38'; for (let yy = y + 8; yy < y + h; yy += 8) c.fillRect(x, yy, w, 1);
      plat('#7cc7f2', '#f4fbff');
      c.fillStyle = '#c9ecff'; for (let k = 0; k < 4; k++) { const hx = x + 18 + k * 9; c.beginPath(); c.moveTo(hx - 2.5, y + 28); c.lineTo(hx + 2.5, y + 28); c.lineTo(hx, y + 34); c.fill(); }
    } else if (id === 'film') {
      c.fillStyle = '#4b463e'; c.fillRect(x, y, w, h);
      plat('#bdb5a4', '#f1ead9');
      c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(x + 21, y, 1, h); c.fillRect(x + 47, y, 0.7, h);
      const v = c.createRadialGradient(x + w / 2, y + h / 2, 8, x + w / 2, y + h / 2, 40);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.8)');
      c.fillStyle = v; c.fillRect(x, y, w, h);
    } else if (id === 'retro') {
      c.fillStyle = '#306b3b'; c.fillRect(x, y, w, h);
      c.fillStyle = '#0f291a';
      for (let yy = 0; yy < h; yy += 4) for (let xx = (yy / 4 % 2) * 4; xx < w; xx += 8) c.fillRect(x + xx, y + yy, 2, 2);
      c.fillStyle = '#0f291a'; c.fillRect(x + 10, y + 18, w - 20, 12);
      c.fillStyle = '#e0f0a0'; c.fillRect(x + 12, y + 18, w - 24, 4);
      c.fillStyle = '#85b547'; c.fillRect(x + 12, y + 22, w - 24, 6);
    } else if (id === 'neon') {
      c.fillStyle = '#12032e'; c.fillRect(x, y, w, h);
      c.fillStyle = 'rgba(255,94,224,.3)';
      for (let xx = x + 8; xx < x + w; xx += 8) c.fillRect(xx, y, 1, h);
      for (let yy = y + 8; yy < y + h; yy += 8) c.fillRect(x, yy, w, 1);
      c.save(); c.shadowColor = '#5ef5ff'; c.shadowBlur = 8; c.strokeStyle = '#5ef5ff'; c.lineWidth = 2;
      c.fillStyle = '#14062e'; rr(x + 12, y + 18, w - 24, 9, 3); c.fill(); c.stroke(); c.restore();
    } else {
      c.fillStyle = '#f7f2e4'; c.fillRect(x, y, w, h);
      c.fillStyle = 'rgba(70,120,200,.3)';
      for (let xx = x + 8; xx < x + w; xx += 8) c.fillRect(xx, y, 1, h);
      for (let yy = y + 8; yy < y + h; yy += 8) c.fillRect(x, yy, w, 1);
      wobblyRect(x + 12, y + 18, w - 24, 10, i + 3, 1); c.fillStyle = '#fffdf6'; c.fill();
      c.strokeStyle = '#3b6fd4'; c.lineWidth = 1.2; c.beginPath();
      for (let hx = x + 6; hx < x + w - 14; hx += 6) { c.moveTo(hx, y + 28); c.lineTo(hx + 8, y + 18); }
      c.save(); wobblyRect(x + 12, y + 18, w - 24, 10, i + 3, 1); c.clip(); c.stroke(); c.restore();
      wobblyRect(x + 12, y + 18, w - 24, 10, i + 3, 1); c.strokeStyle = PEN; c.lineWidth = 1.8; c.stroke();
    }
    c.restore();
  }

  drawTitle() {
    const c = ctx, t = this.t;
    this.dim(0.5);
    c.save(); c.translate(W / 2, 54); c.rotate(-0.03); c.scale(1 + Math.sin(t * 2) * 0.02, 1 + Math.sin(t * 2) * 0.02);
    text('STEP JUMPER', 0, 4, { size: 54, maxW: 430, color: ui.frame, sw: 14, stroke: ui.frame });
    const g = c.createLinearGradient(0, -30, 0, 30);
    g.addColorStop(0, ui.title[0]); g.addColorStop(0.5, ui.title[1]); g.addColorStop(1, ui.title[2]);
    text('STEP JUMPER', 0, 0, { size: 54, maxW: 430, color: g, sw: 5, stroke: ui.titleStroke });
    c.restore();

    // postacie
    this.panel(120, 98, 400, 128);
    text('POSTAĆ', 138, 112, { size: 11, color: ui.label, align: 'left', sw: 0 });
    text('←  →', 502, 112, { size: 11, color: ui.label, align: 'right', sw: 0 });
    CHARS.forEach((ch, i) => {
      const x = slotX(i), on = i === this.charIdx;
      rr(x - 32, UIBOX.chars.y, 64, UIBOX.chars.h, 10);
      c.fillStyle = on ? ui.sel : 'rgba(128,128,160,.10)'; c.fill();
      if (on) { c.strokeStyle = ui.gold; c.lineWidth = 2.5; c.stroke(); }
      const hop = on ? Math.abs(Math.sin(t * 4)) * 4 : 0;
      drawHero({ x: x - 2, y: UIBOX.chars.y + 68 - hop, vx: on ? 260 : 0, vy: 0, face: 1, onFloor: 0, spin: false, angle: 0, squash: 0, runPhase: on ? t * 22 : 0 }, t + i * 0.7, i);
    });
    const ch = CHARS[this.charIdx];
    text(`${ch.name} – ${ch.tag}`, W / 2, 212, { size: 13, sw: 0, maxW: 370 });

    // mapy
    this.panel(120, 236, 400, 98);
    text('MAPA', 138, 250, { size: 11, color: ui.label, align: 'left', sw: 0 });
    text('↑  ↓', 502, 250, { size: 11, color: ui.label, align: 'right', sw: 0 });
    STYLES.forEach((st, i) => {
      const x = slotX(i), on = i === this.styleIdx;
      this.drawSwatch(i, x - 32, UIBOX.maps.y, 64, UIBOX.maps.h);
      rr(x - 32, UIBOX.maps.y, 64, UIBOX.maps.h, 7);
      c.strokeStyle = on ? ui.gold : ui.line; c.lineWidth = on ? 3 : 1; c.stroke();
    });
    text(`${style.name} – ${style.desc}`, W / 2, 319, { size: 13, sw: 0, maxW: 370 });

    // start
    const b = UIBOX.play, pulse = 1 + Math.sin(t * 5) * 0.025;
    c.save(); c.translate(b.x + b.w / 2, b.y + b.h / 2); c.scale(pulse, pulse);
    c.fillStyle = ui.btn; rr(-b.w / 2, -b.h / 2, b.w, b.h, 12); c.fill();
    c.strokeStyle = ui.frame; c.lineWidth = 2.5; c.stroke();
    text(isTouch ? 'GRAJ' : 'GRAJ  ·  SPACJA', 0, 1, { size: 18, color: ui.btnText, sw: 0, maxW: b.w - 24 });
    c.restore();

    const hint = { size: 11, color: ui.note, sw: 3, weight: 700, maxW: 436 };
    if (isTouch || tilt.active) {                          // urządzenia dotykowe: przełącznik sterowania
      const k = UIBOX.ctrl;
      c.fillStyle = ui.panel; rr(k.x, k.y, k.w, k.h, 13); c.fill();
      c.strokeStyle = tilt.active ? ui.gold : ui.line; c.lineWidth = tilt.active ? 2.5 : 1.5; c.stroke();
      text(tilt.active ? 'STEROWANIE: PRZECHYŁ + DOTYK  ·  zmień' : tilt.want ? 'STEROWANIE: PRZECHYŁ  ·  dotknij, aby włączyć' : 'STEROWANIE: PRZYCISKI  ·  włącz przechył', W / 2, k.y + k.h / 2 + 1,
        { size: 12, color: tilt.active ? ui.gold : ui.hint, sw: 0, maxW: k.w - 24 });
      text(tilt.active ? 'Przechylaj telefon, żeby biec  ·  dotknij ekranu, żeby skoczyć' : 'Przyciski ◀ ▶ – bieg, ▲ – skok', W / 2, 429, { ...hint, color: ui.hint });
      text('Im szybciej biegniesz, tym wyżej skaczesz. Odbijaj się od ścian!', W / 2, 444, hint);
    } else {
      text('bieg ← → / A D   ·   skok SPACJA / ↑ / W   ·   pauza P   ·   dźwięk M', W / 2, 402, { ...hint, color: ui.hint });
      text('Im szybciej biegniesz, tym wyżej skaczesz. Odbijaj się od ścian!', W / 2, 420, hint);
      text('Skoki o 2+ piętra z rzędu łączą się w COMBO.', W / 2, 437, hint);
    }
    if (this.best.score > 0) text(`rekord ${this.best.score}  ·  piętro ${this.best.floor}  ·  combo ${this.best.combo}`, W / 2, 460, { size: 12, color: ui.mint, sw: 3, maxW: 436 });
  }

  drawPause() {
    this.dim(0.55);
    text('PAUZA', W / 2, 205, { size: 54, sw: 8 });
    text('P lub SPACJA – wracamy do gry', W / 2, 258, { size: 15, color: ui.hint, sw: 4 });
    text('ESC – menu (zmiana postaci i mapy)', W / 2, 284, { size: 13, color: ui.label, sw: 4 });
  }

  drawOver() {
    const c = ctx, k = clamp(this.overT / 0.35, 0, 1);
    this.dim(0.6 * k);
    c.save(); c.globalAlpha = k; c.translate(0, (1 - easeOutBack(k)) * -40);
    text('KONIEC GRY', W / 2, 100, { size: 50, color: ui.warn, sw: 8, maxW: 430 });
    this.panel(170, 142, 300, 170);
    const rows = [['Wynik', this.score, ui.gold], ['Piętro', this.maxFloor, ui.text], ['Najlepsze combo', this.bestCombo, ui.text], ['Rekord', this.best.score, ui.mint]];
    rows.forEach(([l, v, col], i) => {
      text(l, 196, 172 + i * 36, { size: 15, color: ui.label, align: 'left', sw: 0, weight: 600 });
      text(String(v), 444, 172 + i * 36, { size: i ? 20 : 26, color: col, align: 'right', sw: 0 });
    });
    if (this.newBest) {
      c.save(); c.translate(486, 146); c.rotate(0.22);
      burst(0, 0, 30, 40, 12, this.t); c.fillStyle = '#ffd24a'; c.fill(); c.strokeStyle = '#12173a'; c.lineWidth = 2.5; c.stroke();
      text('NOWY', 0, -7, { size: 12, color: '#12173a', sw: 0 }); text('REKORD', 0, 8, { size: 12, color: '#12173a', sw: 0 });
      c.restore();
    }
    if (this.overT > 0.6) {
      if (Math.sin(this.t * 5) > -0.3) text('SPACJA lub dotknij – jeszcze raz', W / 2, 348, { size: 18, sw: 5, maxW: 430 });
      const b = UIBOX.menu;
      c.fillStyle = ui.panel; rr(b.x, b.y, b.w, b.h, 10); c.fill(); c.strokeStyle = ui.line; c.lineWidth = 1.5; c.stroke();
      text('ESC / tutaj – zmień postać i mapę', W / 2, b.y + b.h / 2 + 1, { size: 12, color: ui.hint, sw: 0, maxW: b.w - 20 });
    }
    c.restore();
  }
}

const game = new Game();
window.__game = game;   // podgląd stanu z konsoli
window.__tilt = { state: tilt, degrees: tiltDegrees };

// zapamiętany tryb przechyłu: Android włącza się od razu, iOS dopiero po pierwszym kliknięciu (wymóg zgody)
if (tilt.want) {
  if (typeof window.DeviceOrientationEvent?.requestPermission === 'function') addEventListener('click', () => { if (tilt.want && !tilt.active) enableTilt(); }, { once: true, capture: true });
  else enableTilt();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  pollGamepad();
  game.frame(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
